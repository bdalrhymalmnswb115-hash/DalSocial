<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دال سوشيال</title><style>body{margin:0;background:#0a0a0a;color:#fff;font-family:sans-serif}header{background:#0f5132;padding:16px;text-align:center;font-weight:900}.card{background:#1a1a1a;margin:10px;padding:12px;border-radius:14px}input{width:100%;padding:12px;border-radius:12px;background:#222;color:#fff;border:1px solid #333}button{background:#0f5132;color:#fff;border:0;padding:12px;border-radius:20px;width:100%;font-weight:900;margin-top:8px}.nav{position:fixed;bottom:0;left:0;right:0;background:#111;display:flex;justify-content:space-around;padding:12px}</style></head><body><header>🌿 دال سوشيال - تطبيق حقيقي</header><div style="padding:12px"><input id="t" placeholder="بماذا تفكر يا ضال؟"><button onclick="post()">نشر</button><div id="f"></div></div><div class="nav"><span>🏠</span><span>🎬</span><span style="background:red;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center">🔴</span><span>💬</span><span>👤</span></div><script>let p=JSON.parse(localStorage.getItem("p")||"[]");function r(){document.getElementById("f").innerHTML=p.map(x=>"<div class=card>"+x+"</div>").join("")}function post(){let v=document.getElementById("t").value;if(!v)return;p.unshift(v);localStorage.setItem("p",JSON.stringify(p));document.getElementById("t").value="";r()}r()</script></body></html>
