name: إنشاء ملف APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install dependencies
        run: npm install
      - name: Sync Capacitor
        run: npx cap sync android || npx cap copy android
      - name: Fix missing cordova file
        run: |
          mkdir -p android/capacitor-cordova-android-plugins
          echo "ext {}" > android/capacitor-cordova-android-plugins/cordova.variables.gradle
      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DalSocial-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
