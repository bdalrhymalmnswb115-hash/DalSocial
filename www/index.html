<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>دال سوشيال</title><style>
*{box-sizing:border-box}body{margin:0;background:#0a0a0a;color:#fff;font-family:system-ui;padding-bottom:80px}
header{background:#0f5132;padding:14px;text-align:center;font-weight:900;position:sticky;top:0;z-index:10}
.card{background:#1a1a1a;margin:10px;padding:14px;border-radius:16px;border:1px solid #222}
input,textarea{width:100%;padding:12px;border-radius:12px;background:#222;color:#fff;border:1px solid #333;font-family:inherit}
button{background:#0f5132;color:#fff;border:0;padding:12px;border-radius:20px;width:100%;font-weight:900;margin-top:8px;font-size:16px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#111;display:flex;justify-content:space-around;padding:10px;border-top:1px solid #222;z-index:99}
.nav span{font-size:22px;padding:8px 14px;border-radius:12px;cursor:pointer}
.nav .active{background:#0f5132}
.page{display:none;padding:12px}.page.active{display:block}
.video{background:#000;border-radius:16px;height:200px;display:flex;align-items:center;justify-content:center;margin:10px 0;font-size:50px;border:1px solid #222}
.avatar{width:80px;height:80px;background:#0f5132;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:40px;margin:10px auto}
.msg{display:flex;gap:10px;padding:12px;border-bottom:1px solid #222}
.msg div{width:40px;height:40px;background:#333;border-radius:50%;display:flex;align-items:center;justify-content:center}
</style></head><body>
<header>🌿 دال سوشيال</header>

<div id="home" class="page active">
<div class="card"><textarea id="t" rows="2" placeholder="بماذا تفكر يا بطل؟"></textarea><button onclick="post()">نشر 🔥</button></div>
<div id="feed"></div>
</div>

<div id="videos" class="page">
<div class="card">🎬 صفحة الفيديو - شغالة!</div>
<div class="video">▶️ فيديو 1 - دال سوشيال</div>
<div class="video">▶️ فيديو 2 - ترند اليمن</div>
<div class="video">▶️ فيديو 3 - مباشر</div>
</div>

<div id="msgs" class="page">
<div class="card">💬 المراسلة - شغالة!</div>
<div class="msg"><div>👤</div><div><b>أحمد</b><br><small>هلا يا ضال كيف حالك؟</small></div></div>
<div class="msg"><div>👤</div><div><b>محمد</b><br><small>شفت الفيديو الجديد؟</small></div></div>
<div class="msg"><div>👤</div><div><b>دال</b><br><small>مرحبا بك في دال سوشيال 🌿</small></div></div>
</div>

<div id="profile" class="page">
<div class="avatar">👤</div>
<div class="card" style="text-align:center"><b>بطل دال</b><br><small>@bdalrhym</small><br><br>🌿 عضو في دال سوشيال<br>📍 صنعاء - اليمن</div>
<div class="card"><b>منشوراتي:</b> <span id="pc">0</span></div>
<div class="card"><button onclick="localStorage.clear();location.reload()">تسجيل خروج</button></div>
</div>

<div class="nav">
<span id="n-home" class="active" onclick="go('home')">🏠</span>
<span id="n-videos" onclick="go('videos')">🎬</span>
<span onclick="go('home')" style="background:#ff0000;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center">➕</span>
<span id="n-msgs" onclick="go('msgs')">💬</span>
<span id="n-profile" onclick="go('profile')">👤</span>
</div>

<script>
let p=JSON.parse(localStorage.getItem("p")||"[]");
function r(){
document.getElementById("feed").innerHTML=p.map((x,i)=>"<div class=card><b>بطل دال</b><br><br>"+x+"<br><br><small>❤️ "+(Math.floor(Math.random()*100)+1)+" - 💬 - 🔁</small></div>").join("")||"<div class=card style='text-align:center;opacity:.5'>لا يوجد منشورات بعد - كن أول من ينشر!</div>";
document.getElementById("pc").innerText=p.length
}
function post(){
let v=document.getElementById("t").value;if(!v.trim())return;p.unshift(v);localStorage.setItem("p",JSON.stringify(p));document.getElementById("t").value="";r();go('home');alert("تم النشر بنجاح ✅")
}
function go(id){
document.querySelectorAll('.page').forEach(e=>e.classList.remove('active'));
document.querySelectorAll('.nav span').forEach(e=>e.classList.remove('active'));
document.getElementById(id).classList.add('active');
let nid="n-"+id;if(document.getElementById(nid))document.getElementById(nid).classList.add('active');
}
r()
</script></body></html>
