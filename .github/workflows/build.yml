name: إنشاء ملف APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Build web app
        run: npm run build || npx vite build || npm run dist || echo "no build"
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Copy web to android
        run: npx cap copy android || cp -r dist/* android/app/src/main/assets/public/ || cp -r build/* android/app/src/main/assets/public/ || true
      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DalSocial-APK-FIXED
          path: android/app/build/outputs/apk/debug/app-debug.apk
